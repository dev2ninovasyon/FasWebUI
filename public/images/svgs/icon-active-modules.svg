  <rect x="21" y="16" width="2" height="6" fill="#81C784" stroke="#2E7D32" stroke-width="3"></rect>
  <rect x="21" y="38" width="2" height="6" fill="#81C784" stroke="#2E7D32" stroke-width="3"></rect>
  <rect x="8" y="29" width="6" height="2" fill="#81C784" stroke="#2E7D32" stroke-width="3"></rect>
  <rect x="30" y="29" width="6" height="2" fill="#81C784" stroke="#2E7D32" stroke-width="3"></rect>

  <!-- Sağ dişli -->
  <circle cx="38" cy="38" r="10" fill="#66BB6A" stroke="#2E7D32" stroke-width="3"></circle>
  <!-- Sağ dişli çıkıntıları -->
  <rect x="37" y="24" width="2" height="6" fill="#66BB6A" stroke="#2E7D32" stroke-width="3"></rect>
  <rect x="37" y="46" width="2" height="6" fill="#66BB6A" stroke="#2E7D32" stroke-width="3"></rect>
