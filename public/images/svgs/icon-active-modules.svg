  <rect x="45" y="37" width="6" height="2" fill="#66BB6A" stroke="#2E7D32" stroke-width="3"></rect>

  <!-- Dişlilerin iç boşlukları -->
  <circle cx="22" cy="30" r="4" fill="#81C784" stroke="#2E7D32" stroke-width="3"></circle>
  <circle cx="38" cy="38" r="4" fill="#66BB6A" stroke="#2E7D32" stroke-width="3"></circle>

  <!-- Üstte onay rozeti (dişlilerle üst üste gelmez) -->
